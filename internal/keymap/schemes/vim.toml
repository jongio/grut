# Vim-style keybinding scheme for grut.
# Extends the default scheme with vim-specific navigation bindings.

# Global bindings (always active)
[[bindings]]
key = "ctrl+c"
action = "quit"
mode = "global"
description = "Quit grut"

[[bindings]]
key = "ctrl+b z"
action = "zoom_toggle"
mode = "global"
description = "Toggle zoom on focused panel"

[[bindings]]
key = "ctrl+left"
action = "resize_left"
mode = "global"
description = "Shrink focused panel left"

[[bindings]]
key = "ctrl+right"
action = "resize_right"
mode = "global"
description = "Grow focused panel right"

[[bindings]]
key = "ctrl+w h"
action = "focus_left"
mode = "global"
description = "Focus panel to the left"

[[bindings]]
key = "ctrl+w l"
action = "focus_right"
mode = "global"
description = "Focus panel to the right"

[[bindings]]
key = "ctrl+space"
action = "chat_focus"
mode = "global"
description = "Toggle AI chat focus"

[[bindings]]
key = "alt+left"
action = "nav_back"
mode = "global"
description = "Navigate back"

[[bindings]]
key = "alt+right"
action = "nav_forward"
mode = "global"
description = "Navigate forward"

[[bindings]]
key = "?"
action = "help"
mode = "global"
description = "Show help overlay"

[[bindings]]
key = "ctrl+g"
action = "command_log"
mode = "global"
description = "Show git command log"

# Panel-specific number keys for direct focus
[[bindings]]
key = "1"
action = "focus_panel_1"
mode = "global"
description = "Focus File Tree panel"

[[bindings]]
key = "2"
action = "focus_panel_2"
mode = "global"
description = "Focus Git Info panel"

[[bindings]]
key = "3"
action = "focus_panel_3"
mode = "global"
description = "Focus GitHub panel"

[[bindings]]
key = "4"
action = "focus_panel_4"
mode = "global"
description = "Focus Commits panel"

[[bindings]]
key = "5"
action = "focus_panel_5"
mode = "global"
description = "Focus Preview panel"

# Panel mode bindings — vim navigation
[[bindings]]
key = "j"
action = "cursor_down"
mode = "panel"
description = "Move cursor down"

[[bindings]]
key = "k"
action = "cursor_up"
mode = "panel"
description = "Move cursor up"

[[bindings]]
key = "g g"
action = "cursor_top"
mode = "panel"
description = "Jump to top"

[[bindings]]
key = "G"
action = "cursor_bottom"
mode = "panel"
description = "Jump to bottom"

[[bindings]]
key = "ctrl+d"
action = "half_page_down"
mode = "panel"
description = "Scroll half page down"

[[bindings]]
key = "ctrl+u"
action = "half_page_up"
mode = "panel"
description = "Scroll half page up"

[[bindings]]
key = "/"
action = "search"
mode = "panel"
description = "Search"

[[bindings]]
key = "n"
action = "search_next"
mode = "panel"
description = "Next search result"

[[bindings]]
key = "N"
action = "search_prev"
mode = "panel"
description = "Previous search result"

[[bindings]]
key = "enter"
action = "select"
mode = "panel"
description = "Select/open item"

[[bindings]]
key = "q"
action = "quit"
mode = "panel"
description = "Quit"

[[bindings]]
key = ":"
action = "command_palette"
mode = "panel"
description = "Open command palette"

[[bindings]]
key = "~"
action = "change_directory"
mode = "panel"
description = "Change directory"

[[bindings]]
key = "T"
action = "todo_finder"
mode = "panel"
description = "Find TODO/FIXME markers"

# File tree specific
[[bindings]]
key = "h"
action = "collapse"
mode = "panel"
context = "filetree"
description = "Collapse directory"

[[bindings]]
key = "l"
action = "expand"
mode = "panel"
context = "filetree"
description = "Expand directory"

[[bindings]]
key = "."
action = "toggle_hidden"
mode = "panel"
context = "filetree"
description = "Toggle hidden files"

[[bindings]]
key = "D"
action = "dir_size"
mode = "panel"
context = "filetree"
description = "Scan directory size"

[[bindings]]
key = "u"
action = "undo_delete"
mode = "panel"
context = "filetree"
description = "Undo delete (restore from trash)"

[[bindings]]
key = "r"
action = "batch_rename"
mode = "panel"
context = "filetree"
description = "Batch rename selection"

# Git status specific
[[bindings]]
key = "s"
action = "stage"
mode = "panel"
context = "gitstatus"
description = "Stage file"

[[bindings]]
key = "u"
action = "unstage"
mode = "panel"
context = "gitstatus"
description = "Unstage file"

[[bindings]]
key = "d"
action = "discard"
mode = "panel"
context = "gitstatus"
description = "Discard changes"

[[bindings]]
key = "c"
action = "commit"
mode = "panel"
context = "gitstatus"
description = "Commit staged changes"

[[bindings]]
key = "P"
action = "push"
mode = "panel"
context = "gitstatus"
description = "Push to remote"

[[bindings]]
key = "p"
action = "pull"
mode = "panel"
context = "gitstatus"
description = "Pull from remote"

[[bindings]]
key = "F"
action = "fetch"
mode = "global"
description = "Fetch all remotes"

# CRUD shortcuts — gitinfo panel
[[bindings]]
key = "n"
action = "item_create"
mode = "panel"
context = "gitinfo"
description = "Create new item (branch/remote/tag/worktree)"

[[bindings]]
key = "x"
action = "item_delete"
mode = "panel"
context = "gitinfo"
description = "Delete selected item"

[[bindings]]
key = "e"
action = "item_edit"
mode = "panel"
context = "gitinfo"
description = "Edit/rename selected item"

[[bindings]]
key = "F2"
action = "item_edit"
mode = "panel"
context = "gitinfo"
description = "Edit/rename selected item"

[[bindings]]
key = "o"
action = "item_open"
mode = "panel"
context = "gitinfo"
description = "Open in browser"

[[bindings]]
key = "y"
action = "item_copy"
mode = "panel"
context = "gitinfo"
description = "Copy identifier to clipboard"

