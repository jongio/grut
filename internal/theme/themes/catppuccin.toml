# Catppuccin Mocha — warm pastel palette on a deep dark base.
# https://github.com/catppuccin/catppuccin

[meta]
name    = "catppuccin"
variant = "mocha"

[colors]
background = "#1E1E2E"
foreground = "#CDD6F4"
cursor     = "#F5E0DC"
selection  = "#585B70"

[colors.normal]
black   = "#45475A"
red     = "#F38BA8"
green   = "#A6E3A1"
yellow  = "#F9E2AF"
blue    = "#89B4FA"
magenta = "#F5C2E7"
cyan    = "#94E2D5"
white   = "#BAC2DE"

[colors.bright]
black   = "#585B70"
red     = "#F38BA8"
green   = "#A6E3A1"
yellow  = "#F9E2AF"
blue    = "#89B4FA"
magenta = "#F5C2E7"
cyan    = "#94E2D5"
white   = "#A6ADC8"

[ui]
border          = "#313244"
border_focused  = "#CBA6F7"
status_bar_bg   = "#181825"
status_bar_fg   = "#CDD6F4"
title_bg        = "#313244"
title_focused_bg = "#3B2E58"
tab_active_bg   = "#89B4FA"
tab_active_fg   = "#1E1E2E"
tab_inactive_bg = "#313244"
tab_inactive_fg = "#BAC2DE"
selection_bg    = "#45475A"
selection_fg    = "#CDD6F4"
cursor_line     = "#313244"

[syntax]
keyword  = "#CBA6F7"
string   = "#A6E3A1"
number   = "#FAB387"
comment  = "#6C7086"
function = "#89B4FA"
type     = "#F9E2AF"
operator = "#89DCEB"

[diff]
added   = "#A6E3A1"
removed = "#F38BA8"
header  = "#89B4FA"
hunk    = "#CBA6F7"
context = "#6C7086"

[git]
staged    = "#A6E3A1"
unstaged  = "#FAB387"
untracked = "#89DCEB"
conflict  = "#F38BA8"
branch    = "#CBA6F7"
tag       = "#F5C2E7"

[notify]
info    = "#89B4FA"
warn    = "#F9E2AF"
error   = "#F38BA8"
success = "#A6E3A1"

[files]
directory  = "#89B4FA"
default    = "#BAC2DE"
executable = "#A6E3A1"
symlink    = "#94E2D5"
