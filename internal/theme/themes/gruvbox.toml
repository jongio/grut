# Gruvbox Dark — retro earthy palette with warm contrast.
# https://github.com/morhetz/gruvbox

[meta]
name    = "gruvbox"
variant = "dark"

[colors]
background = "#282828"
foreground = "#EBDBB2"
cursor     = "#EBDBB2"
selection  = "#3C3836"

[colors.normal]
black   = "#282828"
red     = "#CC241D"
green   = "#98971A"
yellow  = "#D79921"
blue    = "#458588"
magenta = "#B16286"
cyan    = "#689D6A"
white   = "#A89984"

[colors.bright]
black   = "#928374"
red     = "#FB4934"
green   = "#B8BB26"
yellow  = "#FABD2F"
blue    = "#83A598"
magenta = "#D3869B"
cyan    = "#8EC07C"
white   = "#EBDBB2"

[ui]
border          = "#504945"
border_focused  = "#D3869B"
status_bar_bg   = "#1D2021"
status_bar_fg   = "#EBDBB2"
title_bg        = "#3C3836"
title_focused_bg = "#4A3548"
tab_active_bg   = "#D3869B"
tab_active_fg   = "#282828"
tab_inactive_bg = "#3C3836"
tab_inactive_fg = "#A89984"
selection_bg    = "#3C3836"
selection_fg    = "#EBDBB2"
cursor_line     = "#3C3836"

[syntax]
keyword  = "#FB4934"
string   = "#B8BB26"
number   = "#D3869B"
comment  = "#928374"
function = "#83A598"
type     = "#FABD2F"
operator = "#FE8019"

[diff]
added   = "#B8BB26"
removed = "#FB4934"
header  = "#FE8019"
hunk    = "#D3869B"
context = "#928374"

[git]
staged    = "#B8BB26"
unstaged  = "#FABD2F"
untracked = "#928374"
conflict  = "#FB4934"
branch    = "#D3869B"
tag       = "#8EC07C"

[notify]
info    = "#83A598"
warn    = "#FABD2F"
error   = "#FB4934"
success = "#B8BB26"

[files]
directory  = "#83A598"
default    = "#A89984"
executable = "#B8BB26"
symlink    = "#8EC07C"
