# Tokyo Night — a vibrant yet balanced dark palette inspired by Tokyo city lights.
# https://github.com/folke/tokyonight.nvim

[meta]
name    = "tokyonight"
variant = "night"

[colors]
background = "#1A1B26"
foreground = "#C0CAF5"
cursor     = "#C0CAF5"
selection  = "#292E42"

[colors.normal]
black   = "#15161E"
red     = "#F7768E"
green   = "#9ECE6A"
yellow  = "#E0AF68"
blue    = "#7AA2F7"
magenta = "#BB9AF7"
cyan    = "#7DCFFF"
white   = "#A9B1D6"

[colors.bright]
black   = "#414868"
red     = "#F7768E"
green   = "#9ECE6A"
yellow  = "#E0AF68"
blue    = "#7AA2F7"
magenta = "#BB9AF7"
cyan    = "#7DCFFF"
white   = "#C0CAF5"

[ui]
border          = "#3B4261"
border_focused  = "#7AA2F7"
status_bar_bg   = "#24283B"
status_bar_fg   = "#C0CAF5"
title_bg        = "#24283B"
title_focused_bg = "#2A3054"
tab_active_bg   = "#7AA2F7"
tab_active_fg   = "#1A1B26"
tab_inactive_bg = "#292E42"
tab_inactive_fg = "#A9B1D6"
selection_bg    = "#292E42"
selection_fg    = "#C0CAF5"
cursor_line     = "#292E42"

[syntax]
keyword  = "#BB9AF7"
string   = "#9ECE6A"
number   = "#FF9E64"
comment  = "#565F89"
function = "#7AA2F7"
type     = "#E0AF68"
operator = "#89DDFF"

[diff]
added   = "#9ECE6A"
removed = "#F7768E"
header  = "#BB9AF7"
hunk    = "#7AA2F7"
context = "#565F89"

[git]
staged    = "#9ECE6A"
unstaged  = "#E0AF68"
untracked = "#565F89"
conflict  = "#F7768E"
branch    = "#BB9AF7"
tag       = "#7DCFFF"

[notify]
info    = "#7DCFFF"
warn    = "#E0AF68"
error   = "#F7768E"
success = "#9ECE6A"

[files]
directory  = "#7AA2F7"
default    = "#A9B1D6"
executable = "#9ECE6A"
symlink    = "#7DCFFF"
