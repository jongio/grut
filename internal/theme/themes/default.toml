# Default dark theme for grut.
# Purple accent on a dark background — matches the original hardcoded palette.

[meta]
name = "default"

[colors]
background = "#1A1A2E"
foreground = "#E0E0E0"
cursor     = "#F8F8F2"
selection  = "#44475A"

[colors.normal]
black   = "#21222C"
red     = "#FF5555"
green   = "#50FA7B"
yellow  = "#F1FA8C"
blue    = "#BD93F9"
magenta = "#FF79C6"
cyan    = "#8BE9FD"
white   = "#F8F8F2"

[colors.bright]
black   = "#6272A4"
red     = "#FF6E6E"
green   = "#69FF94"
yellow  = "#FFFFA5"
blue    = "#D6ACFF"
magenta = "#FF92DF"
cyan    = "#A4FFFF"
white   = "#FFFFFF"

[ui]
border         = "#444444"
border_focused = "#7D56F4"
status_bar_bg  = "#333333"
status_bar_fg  = "#FAFAFA"
title_bg        = "#2A2A4A"
title_focused_bg = "#3D2D6B"
tab_active_bg  = "#7D56F4"
tab_active_fg  = "#1A1A2E"
tab_inactive_bg = "#333333"
tab_inactive_fg = "#E0E0E0"
selection_bg   = "#44475A"
selection_fg   = "#F8F8F2"
cursor_line    = "#2A2A4A"

[syntax]
keyword  = "#FF79C6"
string   = "#50FA7B"
number   = "#BD93F9"
comment  = "#6272A4"
function = "#8BE9FD"
type     = "#F1FA8C"
operator = "#FF79C6"

[diff]
added   = "#50FA7B"
removed = "#FF5555"
header  = "#F1FA8C"
hunk    = "#BD93F9"
context = "#6272A4"

[git]
staged    = "#50FA7B"
unstaged  = "#F1FA8C"
untracked = "#6272A4"
conflict  = "#FF5555"
branch    = "#BD93F9"
tag       = "#FF79C6"

[notify]
info    = "#8BE9FD"
warn    = "#F1FA8C"
error   = "#FF5555"
success = "#50FA7B"

[files]
directory  = "#8BE9FD"
default    = "#BBBBBB"
executable = "#50FA7B"
symlink    = "#BD93F9"
