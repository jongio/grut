# Default dark theme for grut.
# Industrial dark palette — amber accent on near-black with muted functional colors.

[meta]
name = "default"

[colors]
background = "#0D0D0D"
foreground = "#D4D4D4"
cursor     = "#D4D4D4"
selection  = "#2A2A2A"

[colors.normal]
black   = "#1A1A1A"
red     = "#C44B4B"
green   = "#6B9E56"
yellow  = "#C9A227"
blue    = "#5A7FA0"
magenta = "#9E6B8A"
cyan    = "#5E8E8B"
white   = "#B0B0B0"

[colors.bright]
black   = "#555555"
red     = "#D46A6A"
green   = "#8BB878"
yellow  = "#D4B84A"
blue    = "#7A9EBF"
magenta = "#B08A9E"
cyan    = "#7AADAA"
white   = "#D4D4D4"

[ui]
border         = "#333333"
border_focused = "#C9A227"
status_bar_bg  = "#1A1A1A"
status_bar_fg  = "#D4D4D4"
title_bg        = "#1A1A1A"
title_focused_bg = "#2A2210"
tab_active_bg  = "#C9A227"
tab_active_fg  = "#0D0D0D"
tab_inactive_bg = "#1A1A1A"
tab_inactive_fg = "#888888"
selection_bg   = "#2A2A2A"
selection_fg   = "#D4D4D4"
cursor_line    = "#1E1E1E"

[syntax]
keyword  = "#C9A227"
string   = "#6B9E56"
number   = "#C9875A"
comment  = "#555555"
function = "#7A9EBF"
type     = "#D4B84A"
operator = "#B0B0B0"

[diff]
added   = "#6B9E56"
removed = "#C44B4B"
header  = "#C9A227"
hunk    = "#5A7FA0"
context = "#555555"

[git]
staged    = "#6B9E56"
unstaged  = "#C9A227"
untracked = "#555555"
conflict  = "#C44B4B"
branch    = "#7A9EBF"
tag       = "#C9875A"

[notify]
info    = "#5A7FA0"
warn    = "#C9A227"
error   = "#C44B4B"
success = "#6B9E56"

[files]
directory  = "#7A9EBF"
default    = "#888888"
executable = "#6B9E56"
symlink    = "#5E8E8B"
