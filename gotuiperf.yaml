schemaVersion: 1
# This fast policy screens pull requests for likely regressions.
# Ten short rounds keep feedback timely and are not a high-power analysis.
rounds: 10
benchtime: 100ms
invocationTimeout: 15m
maxOutputBytes: 4194304
packages:
  - path: internal/ai
    benchmarks: "^Benchmark"
  - path: internal/config
    benchmarks: "^Benchmark"
  - path: internal/crashlog
    benchmarks: "^Benchmark"
  - path: internal/git
    benchmarks: "^Benchmark"
  - path: internal/markdown
    benchmarks: "^Benchmark"
  - path: internal/notify
    benchmarks: "^Benchmark"
  - path: internal/panels/filetree
    benchmarks: "^Benchmark"
  - path: internal/panels/gitdiff
    benchmarks: "^Benchmark"
# Distribution policies compare standard benchmark samples. They do not
# measure retained heap and do not prove leak freedom.
metrics:
  - unit: ns/op
    direction: lower
    thresholdPercent: 10
    method: distribution
    alpha: 0.05
  - unit: B/op
    direction: lower
    thresholdPercent: 5
    method: distribution
    alpha: 0.05
  - unit: allocs/op
    direction: lower
    thresholdPercent: 2
    method: distribution
    alpha: 0.05
