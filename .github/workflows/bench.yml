name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 6 AM UTC
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/bench.yml'
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  bench:
    # One benchmark run per branch per platform , avoids artifact collisions.
    concurrency:
      group: bench-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false   # let all platforms finish even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            time_threshold: 15   # stable runners, minimal binary-layout effects
          - os: macos-latest
            time_threshold: 40   # Apple Silicon VMs amplify Go binary-layout non-determinism

    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      # Packages that have benchmark files.
      BENCH_PKGS: >-
        ./internal/ai/
        ./internal/config/
        ./internal/crashlog/
        ./internal/git/
        ./internal/markdown/
        ./internal/notify/
        ./internal/panels/filetree/
        ./internal/panels/gitdiff/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # needed for git push on main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260615155930-9e4b9ddef5b6

      # Compute a stable platform key (e.g. linux-amd64, darwin-arm64).
      # Used for artifact names and baseline paths.
      - name: Set platform key
        run: |
          PLATFORM="$(go env GOOS)-$(go env GOARCH)"
          echo "PLATFORM=$PLATFORM" >> "$GITHUB_ENV"

      - name: Run benchmarks
        if: github.event_name != 'pull_request'
        run: |
          go test -bench=. -benchmem -count=6 -run='^$' -timeout=15m \
            ${{ env.BENCH_PKGS }} | tee bench-current.txt

      # ── PR: benchmark base and PR code on the SAME RUNNER, interleaved.
      #    Apple Silicon GitHub Actions VMs show 30-50% variance across runner
      #    instances, so a stored baseline is unusable.  Running both versions
      #    on one runner fixes that, but running them as two consecutive blocks
      #    leaves a second failure mode: if the runner drifts between the two
      #    blocks, every benchmark in the later block shifts at once and reads
      #    as a uniform package-wide regression.  Interleaving the samples puts
      #    both versions in the same time window, so drift cancels out.
      - name: Run interleaved benchmarks (same-runner baseline)
        if: github.event_name == 'pull_request'
        run: |
          set +e
          bash scripts/bench-interleaved.sh \
            "${{ github.event.pull_request.base.sha }}" 6 \
            bench-baseline.txt bench-current.txt ${{ env.BENCH_PKGS }}
          status=$?
          set -e
          # Exit 3 means nothing on the base commit is comparable.
          if [ "$status" -eq 3 ]; then
            echo "no_baseline=true" >> "$GITHUB_ENV"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ env.PLATFORM }}-${{ github.sha }}
          path: bench-current.txt
          retention-days: 90

      - name: Compare vs same-runner baseline
        if: github.event_name == 'pull_request' && env.no_baseline != 'true'
        run: |
          benchstat bench-baseline.txt bench-current.txt > benchstat-diff.txt
          cat benchstat-diff.txt
          set +e
          bash scripts/bench-regress.sh bench-baseline.txt bench-current.txt \
            ${{ matrix.time_threshold }} 10 > bench-regressions.txt 2>&1
          status=$?
          set -e
          cat bench-regressions.txt
          if [ "$status" -ne 0 ]; then
            echo "regression=true" >> "$GITHUB_ENV"
          fi

      - name: Build PR comment body
        if: github.event_name == 'pull_request' && env.no_baseline != 'true'
        run: |
          {
            echo "## Benchmarks: \`${{ env.PLATFORM }}\`"
            echo ""
            echo "<details>"
            echo "<summary>📊 Results vs <code>main</code> (same-runner) , click to expand</summary>"
            echo ""
            echo '```'
            cat benchstat-diff.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            if [ "${{ env.regression }}" = "true" ]; then
              echo "> [!CAUTION]"
              echo "> Benchmarks regressed by more than ${{ matrix.time_threshold }}% on \`${{ env.PLATFORM }}\`."
              echo ""
              echo "Flagged:"
              echo ""
              echo '```'
              cat bench-regressions.txt
              echo '```'
              echo ""
              echo "Samples are interleaved between base and PR code, so runner drift"
              echo "should cancel out.  If the flagged benchmarks live in packages this"
              echo "PR cannot reach, or a whole package moved together, treat the result"
              echo "as suspect and confirm locally with:"
              echo ""
              echo '```'
              echo "go test -bench=<name> -count=10 -run='^\$' <pkg>   # on base, then on the PR"
              echo "benchstat base.txt pr.txt"
              echo '```'
            else
              echo "> [!NOTE]"
              echo "> No significant regressions on \`${{ env.PLATFORM }}\` (threshold: ${{ matrix.time_threshold }}%, same-runner comparison)."
            fi
          } > bench-comment.md

      - name: Build PR comment body without baseline
        if: github.event_name == 'pull_request' && env.no_baseline == 'true'
        run: |
          {
            echo "## Benchmarks: \`${{ env.PLATFORM }}\`"
            echo ""
            echo "> [!NOTE]"
            echo "> No benchmark packages were available on the base commit for comparison."
          } > bench-comment.md

      - name: Upload PR comment body
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-comment-${{ env.PLATFORM }}
          path: bench-comment.md
          retention-days: 1

      - name: Fail on significant regression
        if: github.event_name == 'pull_request' && env.regression == 'true'
        run: |
          echo "::error::[${{ env.PLATFORM }}] Benchmarks regressed >${{ matrix.time_threshold }}%. See the PR comment."
          exit 1

      # -- main push: upload per-platform baseline for the update-baselines job --
      - name: Upload baseline for commit
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-${{ env.PLATFORM }}
          path: bench-current.txt
          retention-days: 7

  comment:
    if: always() && github.event_name == 'pull_request'
    needs: [bench]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-amd64
          - darwin-arm64
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-comment-${{ matrix.platform }}

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: benchmarks-${{ matrix.platform }}
          path: bench-comment.md

  # Collect baselines from all matrix legs and commit in a single push,
  # avoiding the git-push race that occurs when matrix jobs push concurrently.
  update-baselines:
    if: github.ref == 'refs/heads/main'
    needs: [bench]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: baseline-*
          merge-multiple: false

      - name: Commit updated baselines
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for dir in baseline-*; do
            PLATFORM="${dir#baseline-}"
            mkdir -p "perf/baselines/$PLATFORM"
            cp "$dir/bench-current.txt" "perf/baselines/$PLATFORM/main.txt"
          done
          git add perf/baselines/
          git diff --cached --quiet || \
            git commit -m "perf: update baselines [skip ci]"
          # Retry push up to 3 times with rebase to handle concurrent main updates.
          pushed=false
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              pushed=true
              break
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          if [ "$pushed" = false ]; then
            echo "ERROR: failed to push baselines after 3 attempts"
            exit 1
          fi
